# nginx inside the frontend container: serves the React build and forwards
# /api to the backend.
#
# Putting both behind one origin means the browser only ever talks to nginx:
# no CORS configuration, and the frontend needs no backend URL baked in.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Logs are capped at 50,000 characters by the API; as JSON that is well
    # under 1MB. nginx's default limit is also 1MB - stated here so the limit
    # is a decision, not an accident.
    client_max_body_size 1m;

    location /api/ {
        # "backend" is the docker-compose service name; Docker's DNS resolves
        # it. No trailing slash after the port, so /api/incidents is forwarded
        # as /api/incidents, not stripped to /incidents.
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An analysis waits on Voyage (up to 15s) and then the LLM (up to 60s).
        # nginx's default 60s would cut off a slow but successful analysis with
        # a 504, so allow a little more than the backend's own timeouts.
        proxy_read_timeout 90s;
    }

    # Vite puts a content hash in every asset file name (index-BN12deti.js), so
    # a changed file always gets a new name. That makes caching them forever safe.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else is a React Router route such as /incidents/123. There is
    # no such file on disk, so serve index.html and let the app route it -
    # without this, refreshing any page other than / returns 404.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html must never be cached, or users keep loading old asset names.
        add_header Cache-Control "no-cache";
    }
}
