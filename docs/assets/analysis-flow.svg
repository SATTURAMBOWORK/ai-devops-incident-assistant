<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #0f0d0d; }
    .box { fill: #1a1515; stroke: #3a2a2a; stroke-width: 1.5; }
    .hot { fill: #1a1515; stroke: #f97316; stroke-width: 1.8; }
    .t { fill: #fdf2ee; font-size: 14px; font-weight: 600; }
    .s { fill: #b39a92; font-size: 11px; }
    .lbl { fill: #f97316; font-size: 11px; font-weight: 700; letter-spacing: 2px; }
    .mono { fill: #fca5a5; font-size: 10.5px; font-family: 'Fira Code', Consolas, monospace; }
    .e { stroke: #3a2a2a; stroke-width: 2; fill: none; }
    .f { stroke: #f97316; stroke-width: 2.2; fill: none; stroke-dasharray: 8 12; animation: d 1.3s linear infinite; }
    .opt { stroke: #a3a3a3; stroke-width: 1.8; fill: none; stroke-dasharray: 3 6; animation: d 2s linear infinite; }
    @keyframes d { to { stroke-dashoffset: -20; } }
    .blink { animation: b 1.2s steps(2) infinite; }
    @keyframes b { 50% { opacity: 0; } }
    .p { animation: g 4.5s ease-in-out infinite; }
    .p2 { animation-delay: 1.5s; } .p3 { animation-delay: 3s; }
    @keyframes g { 0%,100% { stroke: #3a2a2a; } 15%,30% { stroke: #f97316; } }
  </style>
  <rect class="bg" width="900" height="380" rx="14"/>
  <text x="30" y="36" class="lbl">HOW AN INCIDENT GETS ANALYSED</text>

  <!-- input -->
  <rect class="hot" x="30" y="70" width="210" height="250" rx="10"/>
  <text x="135" y="96" class="t" text-anchor="middle">Logs + metrics</text>
  <text x="44" y="126" class="mono">ERROR connect ECONNREFUSED</text>
  <text x="44" y="144" class="mono">  127.0.0.1:27017</text>
  <text x="44" y="166" class="mono">Killed process 4121 (node)</text>
  <text x="44" y="184" class="mono">  exit code 137</text>
  <text x="44" y="206" class="mono">CPU 97% · mem 3.9 GB</text>
  <text x="44" y="228" class="mono">error rate 18%</text>
  <rect class="blink" x="44" y="240" width="8" height="13" fill="#fca5a5"/>
  <text x="135" y="300" class="s" text-anchor="middle">pasted into the dashboard</text>

  <!-- fan out -->
  <path class="e" d="M240 110 H300"/><path class="f" d="M240 110 H300"/>
  <path class="e" d="M240 195 H300"/><path class="f" d="M240 195 H300"/>
  <path class="e" d="M240 280 H300"/><path class="opt" d="M240 280 H300"/>

  <!-- signals -->
  <rect class="box p" x="300" y="78" width="260" height="64" rx="10"/>
  <text x="430" y="104" class="t" text-anchor="middle">① RAG retrieval</text>
  <text x="430" y="124" class="s" text-anchor="middle">Voyage AI embeddings → 13-pattern runbook</text>

  <rect class="box p p2" x="300" y="163" width="260" height="64" rx="10"/>
  <text x="430" y="189" class="t" text-anchor="middle">② LLM analysis</text>
  <text x="430" y="209" class="s" text-anchor="middle">Groq gpt-oss-120b · JSON schema + Zod</text>

  <rect class="box p p3" x="300" y="248" width="260" height="64" rx="10"/>
  <text x="430" y="274" class="t" text-anchor="middle">③ Own ML classifier</text>
  <text x="430" y="294" class="s" text-anchor="middle">TF-IDF + LogReg · FastAPI · optional</text>

  <!-- fan in -->
  <path class="e" d="M560 110 H600 V195 H640"/><path class="f" d="M560 110 H600 V195 H640"/>
  <path class="e" d="M560 195 H640"/><path class="f" d="M560 195 H640"/>
  <path class="e" d="M560 280 H600 V195"/><path class="opt" d="M560 280 H600 V195"/>

  <!-- output -->
  <rect class="hot" x="640" y="70" width="230" height="250" rx="10"/>
  <text x="755" y="96" class="t" text-anchor="middle">Structured analysis</text>
  <text x="658" y="128" class="s">▸ summary</text>
  <text x="658" y="150" class="s">▸ likely root cause</text>
  <text x="658" y="172" class="s">▸ supporting evidence</text>
  <text x="658" y="194" class="s">▸ severity</text>
  <text x="658" y="216" class="s">▸ troubleshooting steps</text>
  <text x="658" y="238" class="s">▸ confidence score</text>
  <text x="658" y="260" class="s">▸ classifier agrees / disagrees</text>
  <text x="755" y="300" class="s" text-anchor="middle">saved to MongoDB · browsable history</text>
</svg>
